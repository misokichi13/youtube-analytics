<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTubeアナリティクス データ取得（代行版）</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; color: #333; }
    .container { max-width: 900px; margin: auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { font-size: 1.45rem; color: #c00; text-align: center; }
    .config-box { background: #eef2f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input[type="text"], input[type="date"], select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: .95rem; }
    button { background: #c00; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; margin-top: 15px; width: 100%; font-weight: bold; }
    button:hover { background: #900; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-secondary { background: #6c757d; margin-top: 5px; }
    .mode-box { background: #f0f7ff; padding: 15px; border-radius: 8px; border: 1px solid #cce5ff; margin-bottom: 20px; display: none; }
    .result-box { margin-top: 25px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fafafa; }
    .status { margin-top: 10px; font-weight: bold; color: #0066cc; text-align: center; white-space: pre-wrap; }
    .radio-group { margin: 10px 0; }
    .radio-group label { display: inline-block; margin-right: 15px; font-weight: normal; cursor: pointer; }
    .date-filter { display: flex; gap: 10px; margin-top: 10px; }
    .date-filter div { flex: 1; min-width: 0; }
    .note { font-size: .9rem; color: #555; line-height: 1.5; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .85rem; line-height: 1.5; }
    @media (max-width: 600px) {
      body { margin: 8px; }
      .container { padding: 15px; }
      .date-filter { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>YouTube アナリティクス データ取得（代行版）</h1>
  <p class="note">このページはデータ取得専用です。AI分析は行いません。取得結果はJSON形式で表示されるので、そのままコピーして渡してください。</p>

  <div class="config-box">
    <label for="clientId">OAuth クライアント ID:</label>
    <input type="text" id="clientId" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
    <button id="authBtn" type="button" onclick="handleAuth()">YouTubeアカウントにログイン</button>
  </div>

  <div id="modeSection" class="mode-box">
    <h3>📊 取得メニューを選択</h3>
    <div class="radio-group">
      <label><input type="radio" name="analysisType" value="video" checked onchange="toggleMode()"> 特定の動画のデータを取得</label><br>
      <label><input type="radio" name="analysisType" value="channel" onchange="toggleMode()"> チャンネル全体（直近30日＋前期間比較）</label>
    </div>

    <div id="videoSelectContainer" style="margin-top:15px;">
      <label>投稿期間で絞り込み:</label>
      <div class="date-filter">
        <div>
          <label for="startDate" style="font-size:.85rem;">開始日</label>
          <input type="date" id="startDate">
        </div>
        <div>
          <label for="endDate" style="font-size:.85rem;">終了日</label>
          <input type="date" id="endDate">
        </div>
      </div>
      <button class="btn-secondary" type="button" onclick="fetchRecentVideos()">指定期間の動画を取得</button>

      <label for="videoSelect" style="margin-top:15px;">データを取得する動画を選択:</label>
      <select id="videoSelect">
        <option value="">ログイン後に動画を取得してください</option>
      </select>
    </div>

    <button id="fetchBtn" type="button" onclick="startFetch()" style="background:#007bff; margin-top:20px;">データを取得</button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="result" class="result-box" style="display:none;">
    <h3>取得結果（要点）</h3>
    <pre id="humanSummary"></pre>
    <h3 style="margin-top:18px;">取得データ（JSON）</h3>
    <button class="btn-secondary" type="button" onclick="copyJson()">JSONをコピー</button>
    <pre id="exportJson"></pre>
  </div>
</div>

<script>
  let accessToken = null;
  let recentVideos = [];
  let tokenClient = null;

  const $ = id => document.getElementById(id);
  const setStatus = message => { $("status").innerText = message; };

  function setBusy(busy) {
    $("authBtn").disabled = busy;
    $("fetchBtn").disabled = busy;
  }

  function localDateString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function dateInTimeZone(dateTime, timeZone) {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone, year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date(dateTime));
    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
    return `${values.year}-${values.month}-${values.day}`;
  }

  function addDaysToDateString(dateString, days) {
    const date = new Date(`${dateString}T00:00:00Z`);
    date.setUTCDate(date.getUTCDate() + days);
    return date.toISOString().slice(0, 10);
  }

  function daysBetween(a, b) {
    const da = new Date(`${a}T00:00:00Z`);
    const db = new Date(`${b}T00:00:00Z`);
    return Math.round((db - da) / 86400000);
  }

  window.addEventListener("load", () => {
    const savedClientId = localStorage.getItem("yt_client_id");
    if (savedClientId) $("clientId").value = savedClientId;
    const today = new Date();
    const past = new Date();
    past.setDate(past.getDate() - 180);
    $("endDate").value = localDateString(today);
    $("startDate").value = localDateString(past);
  });

  function handleAuth() {
    const clientId = $("clientId").value.trim();
    if (!clientId) {
      alert("OAuthクライアントIDを入力してください。");
      return;
    }
    if (!window.google?.accounts?.oauth2) {
      setStatus("Google認証ライブラリを読み込めませんでした。通信状態を確認し、ページを再読み込みしてください。");
      return;
    }
    localStorage.setItem("yt_client_id", clientId);
    setStatus("YouTube認証を開始中...");
    $("authBtn").disabled = true;

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: "https://www.googleapis.com/auth/yt-analytics.readonly https://www.googleapis.com/auth/youtube.readonly",
      callback: async tokenResponse => {
        $("authBtn").disabled = false;
        if (tokenResponse?.access_token) {
          accessToken = tokenResponse.access_token;
          $("modeSection").style.display = "block";
          setStatus("ログイン成功。動画一覧を取得します...");
          await fetchRecentVideos();
        } else {
          setStatus("認証に失敗しました。Googleの認証画面や権限設定を確認してください。");
        }
      },
      error_callback: error => {
        $("authBtn").disabled = false;
        setStatus(`Google認証エラー: ${error?.message || error?.type || "詳細不明"}`);
      }
    });
    tokenClient.requestAccessToken();
  }
    function toggleMode() {
    const selected = document.querySelector('input[name="analysisType"]:checked');
    $("videoSelectContainer").style.display =
      selected?.value === "video" ? "block" : "none";
  }

  async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);
    let data;
    try {
      data = await response.json();
    } catch {
      throw new Error(`APIからJSON以外の応答が返りました（HTTP ${response.status}）。`);
    }
    if (!response.ok) {
      throw new Error(data?.error?.message || data?.message || `HTTP ${response.status}`);
    }
    return data;
  }

  function parseDuration(isoDuration) {
    const match = isoDuration.match(/^P(?:(\d+)D)?T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
    if (!match) return 0;
    return Number(match[1] || 0) * 86400
      + Number(match[2] || 0) * 3600
      + Number(match[3] || 0) * 60
      + Number(match[4] || 0);
  }

  function metricNumber(record, name) {
    const value = Number(record?.[name] ?? 0);
    return Number.isFinite(value) ? value : 0;
  }

  async function fetchAnalyticsReport(params) {
    const query = new URLSearchParams(params);
    const url = `https://youtubeanalytics.googleapis.com/v2/reports?${query}`;
    const data = await fetchJson(url, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const headers = (data.columnHeaders || []).map(column => column.name);
    return (data.rows || []).map(row => {
      const record = {};
      headers.forEach((name, index) => { record[name] = row[index]; });
      return record;
    });
  }

  // 個別レポートの失敗で全体を止めないためのラッパー
  async function tryReport(errors, name, params) {
    try {
      return await fetchAnalyticsReport(params);
    } catch (error) {
      errors.push({ report: name, error: error.message });
      return null;
    }
  }

  async function fetchRecentVideos() {
    if (!accessToken) {
      setStatus("先にYouTubeアカウントへログインしてください。");
      return;
    }
    const startVal = $("startDate").value;
    const endVal = $("endDate").value;
    if (!startVal || !endVal || startVal > endVal) {
      setStatus("投稿期間の開始日と終了日を正しく指定してください。");
      return;
    }
    setStatus("動画一覧を取得中...");
    try {
      const headers = { Authorization: `Bearer ${accessToken}` };
      const chData = await fetchJson(
        "https://youtube.googleapis.com/youtube/v3/channels?part=contentDetails&mine=true",
        { headers }
      );
      const uploadsPlaylistId = chData.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
      if (!uploadsPlaylistId) {
        throw new Error("アップロード動画一覧を取得できませんでした。チャンネル権限を確認してください。");
      }

      // ページングで遡る（最大250件）。古い方へ進み、期間開始より古くなったら打ち切る
      const videoIds = [];
      let pageToken = "";
      for (let page = 0; page < 5; page++) {
        const playlistUrl = new URL("https://youtube.googleapis.com/youtube/v3/playlistItems");
        const params = {
          playlistId: uploadsPlaylistId,
          part: "snippet,contentDetails",
          maxResults: "50"
        };
        if (pageToken) params.pageToken = pageToken;
        playlistUrl.search = new URLSearchParams(params).toString();
        const playlistData = await fetchJson(playlistUrl.toString(), { headers });
        const items = playlistData.items || [];
        if (!items.length) break;
        items.forEach(item => {
          const vid = item.contentDetails?.videoId || item.snippet?.resourceId?.videoId;
          if (vid) videoIds.push(vid);
        });
        const lastPublished = (items[items.length - 1].snippet?.publishedAt || "").slice(0, 10);
        pageToken = playlistData.nextPageToken || "";
        if (!pageToken) break;
        if (lastPublished && lastPublished < startVal) break;
      }

      const uniqueIds = [...new Set(videoIds)];
      if (!uniqueIds.length) {
        recentVideos = [];
        updateVideoSelect();
        setStatus("動画一覧が空でした。");
        return;
      }

      const details = [];
      for (let i = 0; i < uniqueIds.length; i += 50) {
        const chunk = uniqueIds.slice(i, i + 50);
        const detailsUrl = new URL("https://youtube.googleapis.com/youtube/v3/videos");
        detailsUrl.search = new URLSearchParams({
          id: chunk.join(","),
          part: "contentDetails,snippet,statistics,liveStreamingDetails"
        }).toString();
        const detailsData = await fetchJson(detailsUrl.toString(), { headers });
        details.push(...(detailsData.items || []));
      }

      recentVideos = details
        .map(item => {
          const publishedAtRaw = item.snippet?.publishedAt || "";
          const publishedAt = publishedAtRaw ? publishedAtRaw.slice(0, 10) : "";
          const analyticsStartDate = publishedAtRaw
            ? dateInTimeZone(publishedAtRaw, "America/Los_Angeles")
            : publishedAt;
          const durationSeconds = parseDuration(item.contentDetails?.duration || "");
          const live = item.liveStreamingDetails || null;
          return {
            id: item.id,
            title: item.snippet?.title || "(タイトル不明)",
            publishedAt,
            analyticsStartDate,
            currentViewCount: Number(item.statistics?.viewCount || 0),
            currentLikeCount: Number(item.statistics?.likeCount || 0),
            currentCommentCount: Number(item.statistics?.commentCount || 0),
            durationSeconds,
            isLiveArchive: Boolean(live?.actualStartTime),
            liveActualStart: live?.actualStartTime || null,
            liveActualEnd: live?.actualEndTime || null
          };
        })
        .filter(video => video.publishedAt >= startVal && video.publishedAt <= endVal)
        .sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));

      updateVideoSelect();
      setStatus(recentVideos.length
        ? `準備完了。指定期間内の動画 ${recentVideos.length} 件を取得しました。`
        : "指定期間内に投稿された動画がありません。期間を変更してください。");
    } catch (error) {
      console.error(error);
      setStatus(`動画一覧の取得に失敗しました。\n${error.message}`);
    }
  }

  function updateVideoSelect() {
    const select = $("videoSelect");
    select.innerHTML = "";
    if (!recentVideos.length) {
      select.add(new Option("該当する動画がありません", ""));
      return;
    }
    recentVideos.forEach(video => {
      const kind = video.isLiveArchive ? "配信" : "動画";
      select.add(new Option(
        `[${kind}] [${video.publishedAt}] ${video.title}`,
        video.id
      ));
    });
  }

  async function startFetch() {
    const type = document.querySelector('input[name="analysisType"]:checked')?.value;
    $("result").style.display = "none";
    if (!accessToken) {
      setStatus("先にYouTubeアカウントへログインしてください。");
      return;
    }
    setBusy(true);
    try {
      if (type === "channel") {
        await fetchChannelData();
      } else {
        await fetchVideoData();
      }
    } finally {
      setBusy(false);
    }
  }
    function showResult(payload, humanText) {
    $("humanSummary").textContent = humanText;
    $("exportJson").textContent = JSON.stringify(payload, null, 2);
    $("result").style.display = "block";
  }

  function copyJson() {
    const text = $("exportJson").textContent;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(
        () => setStatus("JSONをコピーしました。"),
        () => setStatus("コピーに失敗しました。JSON部分を手動で選択してコピーしてください。")
      );
    }
  }

  function round3(value) {
    return Math.round((Number(value) || 0) * 1000) / 1000;
  }

  function pctChange(now, prev) {
    const n = Number(now) || 0;
    const p = Number(prev) || 0;
    if (p === 0) return null;
    return Math.round((n - p) / p * 1000) / 10;
  }

  async function fetchVideoData() {
    const videoId = $("videoSelect").value;
    if (!videoId) {
      setStatus("動画を選択してください。");
      return;
    }
    const video = recentVideos.find(v => v.id === videoId);
    if (!video) {
      setStatus("選択した動画の情報が見つかりません。動画一覧を再取得してください。");
      return;
    }
    setStatus(`「${video.title}」のデータを取得中...`);
    const errors = [];
    try {
      const todayPacific = dateInTimeZone(new Date().toISOString(), "America/Los_Angeles");
      const endDate = addDaysToDateString(todayPacific, -1);
      const startDate = video.analyticsStartDate;
      const base = { ids: "channel==MINE", startDate, endDate, filters: `video==${videoId}` };

      const totalRows = await tryReport(errors, "totals", {
        ...base,
        metrics: "views,engagedViews,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,likes,comments,shares,subscribersGained,subscribersLost"
      });
      const dailyRows = await tryReport(errors, "daily", {
        ...base,
        metrics: "views,estimatedMinutesWatched",
        dimensions: "day",
        sort: "day",
        maxResults: "1000"
      });
      const retentionRows = await tryReport(errors, "retention", {
        ...base,
        metrics: "audienceWatchRatio,relativeRetentionPerformance",
        dimensions: "elapsedVideoTimeRatio",
        maxResults: "200"
      });
      const trafficRows = await tryReport(errors, "traffic", {
        ...base,
        metrics: "views,estimatedMinutesWatched",
        dimensions: "insightTrafficSourceType",
        sort: "-views"
      });
      const subscribedRows = await tryReport(errors, "subscribedStatus", {
        ...base,
        metrics: "views,estimatedMinutesWatched",
        dimensions: "subscribedStatus"
      });
      const liveRows = await tryReport(errors, "liveOrOnDemand", {
        ...base,
        metrics: "views,estimatedMinutesWatched,averageViewDuration",
        dimensions: "liveOrOnDemand"
      });
      const typeRows = await tryReport(errors, "creatorContentType", {
        ...base,
        metrics: "views",
        dimensions: "creatorContentType"
      });

      const total = (totalRows && totalRows[0]) || {};
      const totals = {
        views: metricNumber(total, "views"),
        engagedViews: metricNumber(total, "engagedViews"),
        estimatedMinutesWatched: metricNumber(total, "estimatedMinutesWatched"),
        averageViewDurationSec: metricNumber(total, "averageViewDuration"),
        averageViewPercentage: metricNumber(total, "averageViewPercentage"),
        likes: metricNumber(total, "likes"),
        comments: metricNumber(total, "comments"),
        shares: metricNumber(total, "shares"),
        subscribersGained: metricNumber(total, "subscribersGained"),
        subscribersLost: metricNumber(total, "subscribersLost")
      };
      totals.subscribersNet = totals.subscribersGained - totals.subscribersLost;
      totals.engagedRatio = totals.views > 0
        ? round3(totals.engagedViews / totals.views) : null;

      // 日別を暦日でそろえ、欠けた日は0として特徴量を計算する
      const ageDays = Math.min(daysBetween(startDate, endDate) + 1, 400);
      const dailyMap = new Map();
      (dailyRows || []).forEach(row => {
        dailyMap.set(row.day, {
          views: metricNumber(row, "views"),
          minutes: metricNumber(row, "estimatedMinutesWatched")
        });
      });
      const series = [];
      for (let i = 0; i < ageDays; i++) {
        const day = addDaysToDateString(startDate, i);
        const entry = dailyMap.get(day) || { views: 0, minutes: 0 };
        series.push({ day, views: entry.views, minutes: entry.minutes });
      }
      const sumViews = list => list.reduce((s, e) => s + e.views, 0);
      let peak = { day: null, views: 0 };
      series.forEach(e => { if (e.views > peak.views) peak = { day: e.day, views: e.views }; });
      const features = {
        ageDays,
        viewsFirstDay: series.length ? series[0].views : 0,
        viewsFirst7Days: sumViews(series.slice(0, 7)),
        viewsFirst28Days: ageDays >= 28 ? sumViews(series.slice(0, 28)) : null,
        viewsLast7Days: sumViews(series.slice(-7)),
        peakDay: peak.day,
        peakDayViews: peak.views
      };

      // 維持率カーブの要約
      let retention = null;
      if (retentionRows && retentionRows.length) {
        const points = retentionRows
          .map(row => ({
            at: Number(row.elapsedVideoTimeRatio),
            watch: metricNumber(row, "audienceWatchRatio"),
            rel: metricNumber(row, "relativeRetentionPerformance")
          }))
          .filter(p => Number.isFinite(p.at))
          .sort((a, b) => a.at - b.at);
        const fracs = [0, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.9, 0.99];
        const atFractions = fracs.map(f => {
          let best = points[0];
          points.forEach(p => {
            if (Math.abs(p.at - f) < Math.abs(best.at - f)) best = p;
          });
          return { fraction: f, at: best.at, watch: round3(best.watch), rel: round3(best.rel) };
        });
        let biggestDrop = null;
        for (let i = 1; i < points.length; i++) {
          const drop = points[i - 1].watch - points[i].watch;
          if (!biggestDrop || drop > biggestDrop.drop) {
            biggestDrop = { fromAt: points[i - 1].at, toAt: points[i].at, drop: round3(drop) };
          }
        }
        const curve = points
          .filter((_, i) => i % 5 === 0 || i === points.length - 1)
          .map(p => ({ at: p.at, watch: round3(p.watch), rel: round3(p.rel) }));
        retention = { atFractions, biggestDrop, curve };
      }

      const trafficTotal = (trafficRows || []).reduce((s, r) => s + metricNumber(r, "views"), 0);
      const traffic = (trafficRows || []).map(row => {
        const views = metricNumber(row, "views");
        return {
          source: row.insightTrafficSourceType,
          views,
          sharePct: trafficTotal > 0 ? Math.round(views / trafficTotal * 1000) / 10 : null,
          minutes: metricNumber(row, "estimatedMinutesWatched")
        };
      });
            const subsTotal = (subscribedRows || []).reduce((s, r) => s + metricNumber(r, "views"), 0);
      const subscribed = (subscribedRows || []).map(row => {
        const views = metricNumber(row, "views");
        return {
          status: row.subscribedStatus,
          views,
          sharePct: subsTotal > 0 ? Math.round(views / subsTotal * 1000) / 10 : null,
          minutes: metricNumber(row, "estimatedMinutesWatched")
        };
      });

      const liveSplit = (liveRows || []).map(row => ({
        type: row.liveOrOnDemand,
        views: metricNumber(row, "views"),
        minutes: metricNumber(row, "estimatedMinutesWatched"),
        averageViewDurationSec: metricNumber(row, "averageViewDuration")
      }));

      const contentType = (typeRows || []).map(row => ({
        type: row.creatorContentType,
        views: metricNumber(row, "views")
      }));

      const payload = {
        kind: "video",
        fetchedAt: new Date().toISOString(),
        video: {
          id: video.id,
          title: video.title,
          publishedAt: video.publishedAt,
          durationSeconds: video.durationSeconds,
          isLiveArchive: video.isLiveArchive,
          liveActualStart: video.liveActualStart,
          liveActualEnd: video.liveActualEnd,
          currentViewCount: video.currentViewCount,
          currentLikeCount: video.currentLikeCount,
          currentCommentCount: video.currentCommentCount
        },
        period: { startDate, endDate },
        totals,
        features,
        dailySeries: series,
        retention,
        traffic,
        subscribed,
        liveSplit,
        contentType,
        errors
      };

      const human = [
        `タイトル: ${video.title}`,
        `公開日: ${video.publishedAt} / 集計終了: ${endDate}（公開後 ${features.ageDays} 日）`,
        `再生回数: ${totals.views} / エンゲージビュー: ${totals.engagedViews}（比率 ${totals.engagedRatio ?? "-"}）`,
        `平均視聴時間: ${totals.averageViewDurationSec}秒 / 平均視聴率: ${totals.averageViewPercentage}%`,
        `初速: 初日 ${features.viewsFirstDay} / 7日 ${features.viewsFirst7Days} / 直近7日 ${features.viewsLast7Days}`,
        `登録者純増: ${totals.subscribersNet} / 高評価: ${totals.likes} / コメント: ${totals.comments}`,
        errors.length ? `取得できなかった項目: ${errors.map(e => e.report).join(", ")}` : "全項目を取得できました。"
      ].join("\n");

      showResult(payload, human);
      setStatus("データ取得が完了しました。JSONをコピーして渡してください。");
    } catch (error) {
      console.error(error);
      setStatus(`データ取得に失敗しました。\n${error.message}`);
    }
  }

  async function fetchChannelData() {
    setStatus("チャンネル全体のデータを取得中...");
    const errors = [];
    try {
      const todayPacific = dateInTimeZone(new Date().toISOString(), "America/Los_Angeles");
      const endDate = addDaysToDateString(todayPacific, -1);
      const startDate = addDaysToDateString(endDate, -29);
      const prevEnd = addDaysToDateString(startDate, -1);
      const prevStart = addDaysToDateString(prevEnd, -29);
      const metrics = "views,estimatedMinutesWatched,averageViewDuration,subscribersGained,subscribersLost,likes,comments";

      const nowRows = await tryReport(errors, "totalsNow", {
        ids: "channel==MINE", startDate, endDate, metrics
      });
      const prevRows = await tryReport(errors, "totalsPrev", {
        ids: "channel==MINE", startDate: prevStart, endDate: prevEnd, metrics
      });
      const typeRows = await tryReport(errors, "byType", {
        ids: "channel==MINE", startDate, endDate,
        metrics: "views,estimatedMinutesWatched,averageViewDuration",
        dimensions: "creatorContentType", sort: "-views"
      });
      const liveRows = await tryReport(errors, "byLive", {
        ids: "channel==MINE", startDate, endDate,
        metrics: "views,estimatedMinutesWatched,averageViewDuration",
        dimensions: "liveOrOnDemand", sort: "-views"
      });
      const topRows = await tryReport(errors, "topVideos", {
        ids: "channel==MINE", startDate, endDate,
        metrics: "views,estimatedMinutesWatched,averageViewDuration",
        dimensions: "video", sort: "-views", maxResults: "10"
      });

      const pick = rows => {
        const r = (rows && rows[0]) || {};
        return {
          views: metricNumber(r, "views"),
          estimatedMinutesWatched: metricNumber(r, "estimatedMinutesWatched"),
          averageViewDurationSec: metricNumber(r, "averageViewDuration"),
          subscribersGained: metricNumber(r, "subscribersGained"),
          subscribersLost: metricNumber(r, "subscribersLost"),
          subscribersNet: metricNumber(r, "subscribersGained") - metricNumber(r, "subscribersLost"),
          likes: metricNumber(r, "likes"),
          comments: metricNumber(r, "comments")
        };
      };
      const nowTotals = pick(nowRows);
      const prevTotals = pick(prevRows);
      const deltaPct = {};
      Object.keys(nowTotals).forEach(key => {
        deltaPct[key] = pctChange(nowTotals[key], prevTotals[key]);
      });

      let topVideos = [];
      if (topRows && topRows.length) {
        const ids = topRows.map(r => r.video).filter(Boolean);
        const titleMap = new Map();
        if (ids.length) {
          try {
            const detailsUrl = new URL("https://youtube.googleapis.com/youtube/v3/videos");
            detailsUrl.search = new URLSearchParams({
              id: ids.join(","), part: "snippet"
            }).toString();
            const detailsData = await fetchJson(detailsUrl.toString(), {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            (detailsData.items || []).forEach(item => {
              titleMap.set(item.id, item.snippet?.title || "");
            });
          } catch (error) {
            errors.push({ report: "topVideoTitles", error: error.message });
          }
        }
        topVideos = topRows.map(row => ({
          id: row.video,
          title: titleMap.get(row.video) || "(タイトル不明)",
          views: metricNumber(row, "views"),
          minutes: metricNumber(row, "estimatedMinutesWatched"),
          averageViewDurationSec: metricNumber(row, "averageViewDuration")
        }));
      }

      const payload = {
        kind: "channel",
        fetchedAt: new Date().toISOString(),
        period: { startDate, endDate },
        previousPeriod: { startDate: prevStart, endDate: prevEnd },
        totals: { now: nowTotals, prev: prevTotals, deltaPct },
        byType: (typeRows || []).map(row => ({
          type: row.creatorContentType,
          views: metricNumber(row, "views"),
          minutes: metricNumber(row, "estimatedMinutesWatched"),
          averageViewDurationSec: metricNumber(row, "averageViewDuration")
        })),
        byLive: (liveRows || []).map(row => ({
          type: row.liveOrOnDemand,
          views: metricNumber(row, "views"),
          minutes: metricNumber(row, "estimatedMinutesWatched"),
          averageViewDurationSec: metricNumber(row, "averageViewDuration")
        })),
        topVideos,
        errors
      };

      const human = [
        `期間: ${startDate} ～ ${endDate}（前期間: ${prevStart} ～ ${prevEnd}）`,
        `再生回数: ${nowTotals.views}（前期間比 ${deltaPct.views ?? "-"}%）`,
        `総再生時間: ${nowTotals.estimatedMinutesWatched}分（前期間比 ${deltaPct.estimatedMinutesWatched ?? "-"}%）`,
        `登録者純増: ${nowTotals.subscribersNet}（前期間 ${prevTotals.subscribersNet}）`,
        `高評価: ${nowTotals.likes} / コメント: ${nowTotals.comments}`,
        errors.length ? `取得できなかった項目: ${errors.map(e => e.report).join(", ")}` : "全項目を取得できました。"
      ].join("\n");

      showResult(payload, human);
      setStatus("データ取得が完了しました。JSONをコピーして渡してください。");
    } catch (error) {
      console.error(error);
      setStatus(`データ取得に失敗しました。\n${error.message}`);
    }
  }
</script>
